<app-navbar (searchEvent)="updateSpells($event)" />
@if (spells.length != 0) {
  <div class="flex flex-wrap gap-8 justify-center mt-4">
    @for (spell of spells; track $index) {
      <app-spell-card [spell]="spell" />
    }
  </div>
} @else {
  <p>Welcome to Spellbook2e! If you are lost, check the guide!</p>
}
