<div class="card w-90 h-60 bg-foreground rounded-md flex-col flex shadow-lg shadow-title/12">
  <div class="flex justify-between bg-title text-title-text p-1.5 rounded-md">
    <h1 class="font-nunito font-extrabold text-[1.2rem] capitalize pl-2 cursor-pointer select-none">
      <a (click)="isInfoOpen.set(true)">{{ spell().name }}</a>
    </h1>

    <p class="text-right flex self-center">
      @for (star of stars; track $index) {
        <app-star
          (starClicked)="onStarClickEvent($event)"
          [starId]="star"
          [rating]="spellPersonalData().rating"
        />
      }
    </p>
  </div>

  <div class="flex flex-wrap mt-1 mr-1 ml-1 gap-1">
    @for (trait of spell().system.traits.value; track $index) {
      <app-trait [trait]="trait" />
    }
  </div>

  <div class="h-full">
    <app-description-area
      (descriptionChanged)="onDescChangedEvent($event)"
      [description]="spellPersonalData().description"
    />
  </div>

  <div class="ml-auto flex m-2 mr-3">
    <app-prepare-button
      (prepClicked)="onPrepClickEvent()"
      [isPrepared]="spellPersonalData().prepared"
    />
    <app-fav-button (favClicked)="onFavClickEvent()" [isFav]="spellPersonalData().favorite" />
  </div>
</div>

<!-- INFO POPUP -->
@if (isInfoOpen()) {
  <app-spell-popup [spell]="spell()" (closeInfo)="isInfoOpen.set(false)" />
}
